# PowerDNS Authoritative, for the tests. Not the machine's configuration.
#
# The machine's is `docs/operations.md`'s and lives on the machine (#10, #12) —
# Response Rate Limiting, TSIG-signed `AXFR` restricted to the secondaries, and
# DNSSEC are all preconditions of answering a public query and none of them is
# exercised by a test that talks to the loopback.
#
# What this file is for is one property: PowerDNS reads the same database our
# three tables live in (N-002), so issuing a name and publishing its record is a
# transaction rather than a distributed operation (N-004).

launch=gpgsql
gpgsql-host=postgres
gpgsql-port=5432
gpgsql-user=kolonie_dns
gpgsql-password=postgres
gpgsql-dbname=kolonie_dns

local-address=0.0.0.0
local-port=53

# N-028: we keep aggregate counters and no query log. The default is already
# this; it is written out because a default is not a decision, and the first
# person to turn it on for a debugging session should have to delete a line that
# says why it is off.
log-dns-queries=no
loglevel=3

# The hidden primary answers nothing on the internet (N-005). In the compose
# file the port is bound to the loopback; this is the second half of the same
# statement, and it is the one that survives somebody copying this file.
disable-axfr=yes

# Every cache off, which is a test setting and not a production one.
#
# The zone cache is the one that matters: it refreshes every five minutes by
# default, so a zone a test inserts is invisible to PowerDNS for up to five
# minutes afterwards. That failure looks exactly like a broken record write, and
# it would be intermittent — the worst shape a test failure can take.
#
# **On the machine these all go back to their defaults.** A nameserver that
# consults PostgreSQL for every query is a nameserver whose packet rate is the
# database's, and packet rate is what sizes this service.
zone-cache-refresh-interval=0
query-cache-ttl=0
negquery-cache-ttl=0
