name: Reviewer Agent

# The review a citizen's pull request gets without waiting for the operator
# (kolonie-docs#42, extended by kolonie-docs#123). The rules live once, in
# kolonie-docs, same as `triage.yml` beside this file.
#
# `workflow_run` on the check, so `review-guidelines.md`'s *"CI must pass before
# review begins"* is structural rather than requested — there is no path here
# that runs before a build has a verdict. It also picks up every push to the
# branch for free, because the check does.
#
# ## Why this repository can have it now
#
# `kolonie-website` carries the same file and its comment records why it was, on
# 2026-08-02, the only repository of four that could: the trigger needs a check
# that runs on **every** pull request, and a path-filtered one leaves pull
# requests with no build for a reviewer to hang off. This repository had no check
# of any kind until #16. It now has one, named `check`, with no path filter — so
# the prerequisite is met here for the first time (kolonie-dns#18).
#
# `secrets: inherit` rather than naming one: the called workflow declares
# OPENROUTER_API_KEY as optional, and inheriting means adding the secret is the
# only step needed to switch the reviewer on. Without it the job logs that it has
# no key and exits clean — deliberately visible in the run log rather than
# silent.

on:
  workflow_run:
    workflows: [check]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  issues: read
  actions: read

jobs:
  review:
    uses: Kolonie-AI/kolonie-docs/.github/workflows/review-pull-request.yml@main
    secrets: inherit
    permissions:
      contents: read
      pull-requests: write
      issues: read
      actions: read
